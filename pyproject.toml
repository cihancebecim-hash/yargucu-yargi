version = "2.0.0"
description = "YARGUCU kendi MCP sunucusu: yargı araçları, Resmî Gazete ve Kaynak Motoru"
requires-python = ">=3.11"
dependencies = [
  "yargi-mcp==0.2.2",
  "fastmcp==3.4.4",
  "mcp==1.28.1",
  "pydantic==2.13.4",
  "pypdfium2>=4.30",
  "pillow>=10",
  "httpx==0.28.1",
  "beautifulsoup4==4.15.0",
  "pytesseract==0.3.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]
